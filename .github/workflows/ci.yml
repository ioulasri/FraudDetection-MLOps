name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop, data-pipeline ]
  pull_request:
    branches: [ main, develop ]

jobs:
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Code formatting with Black
      run: |
        black --check src/ tests/
      continue-on-error: false

    - name: Linting with Flake8
      run: |
        flake8 src/ tests/ --max-line-length=100 --extend-ignore=E203,W503
      continue-on-error: false

    - name: Type checking with MyPy
      run: |
        mypy src/ --ignore-missing-imports --no-strict-optional
      continue-on-error: true

    - name: Security scan with Bandit
      run: |
        bandit -r src/ -ll
      continue-on-error: true

    - name: Import sorting with isort
      run: |
        isort --check-only --profile black src/ tests/
      continue-on-error: false

  tests:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: code-quality

    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Create necessary directories
      run: |
        mkdir -p data/raw data/processed data/splits logs models/saved

    - name: Run unit tests with coverage
      run: |
        pytest tests/ -v --cov=src --cov-report=xml --cov-report=term-missing --cov-fail-under=70
      continue-on-error: false

    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
      continue-on-error: true

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: tests

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Create necessary directories
      run: |
        mkdir -p data/raw data/processed data/splits logs models/saved

    - name: Run integration tests
      run: |
        pytest tests/ -v -m "integration" --cov=src
      continue-on-error: true

  build-docs:
    name: Build Documentation
    runs-on: ubuntu-latest
    needs: code-quality

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Check documentation
      run: |
        echo "Documentation check placeholder"
        # Add sphinx or mkdocs build here if needed
      continue-on-error: true

  dependency-security:
    name: Dependency Security Scan
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install safety

    - name: Check for security vulnerabilities
      run: |
        safety check --json
      continue-on-error: true

  model-validation:
    name: Model Pipeline Validation
    runs-on: ubuntu-latest
    needs: tests

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Create necessary directories
      run: |
        mkdir -p data/raw data/processed data/splits logs models/saved

    - name: Validate data pipeline config
      run: |
        python src/data/config.py
      continue-on-error: false

    - name: Check pipeline imports
      run: |
        python -c "from src.data.loader import DataLoader; from src.data.preprocessor import PreprocessingPipeline; from src.data.splitter import DataSplitter"
      continue-on-error: false

  notify:
    name: Notify Status
    runs-on: ubuntu-latest
    needs: [code-quality, tests, integration-tests, dependency-security, model-validation]
    if: always()

    steps:
    - name: Check workflow status
      run: |
        echo "Code Quality: ${{ needs.code-quality.result }}"
        echo "Tests: ${{ needs.tests.result }}"
        echo "Integration Tests: ${{ needs.integration-tests.result }}"
        echo "Security Scan: ${{ needs.dependency-security.result }}"
        echo "Model Validation: ${{ needs.model-validation.result }}"
